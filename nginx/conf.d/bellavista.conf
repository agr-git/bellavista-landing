# Bellavista Coffee — site config.
#
# Phase A (B11): HTTP-only. Validate the stack is up on the VPS IP.
# Phase B (S1):  uncomment the HTTPS server + HTTP → HTTPS redirect
#                AFTER certbot has issued certs for your domain.

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with bellavista-coffee.com.co in S1.

    # Certbot ACME challenge (used in S1 when DNS is live).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Long-cache self-hosted media (drone video, photography).
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Next.js static assets — content-hashed, safe to cache hard.
    location /_next/static/ {
        proxy_pass http://bellavista_app;
        proxy_cache_bypass 0;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else proxies to the Next.js server.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
        proxy_pass http://bellavista_app;
    }
}

