# Top-level nginx config. Bellavista-only — n8n has its own nginx (or
# none). Keep this file thin; per-site config in ./conf.d/*.conf.

user  nginx;
worker_processes  auto;
pid  /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Small server footprint — this is a 2 GB box.
    server_tokens off;
    client_max_body_size 2m;

    # Gzip (brotli needs the nginx-brotli build; gzip is enough for v1).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # Upstream for the Next.js app container.
    upstream bellavista_app {
        server app:3000;
        keepalive 16;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
