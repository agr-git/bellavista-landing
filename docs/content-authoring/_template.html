<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bellavista — {{section_name}} preview</title>

<!-- Design tokens (single source of truth, shared with the React app) -->
<link rel="stylesheet" href="../../../app/styles/tokens.css">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Tailwind via CDN — preview only, never shipped -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  /* Override the next/font CSS vars so the page-level fonts resolve */
  :root {
    --font-instrument-serif: "Instrument Serif";
    --font-geist-sans: "Geist";
    --font-jetbrains-mono: "JetBrains Mono";
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    margin: 0;
  }
  .font-serif  { font-family: var(--font-serif); }
  .font-sans   { font-family: var(--font-sans); }
  .font-mono   { font-family: var(--font-mono); }

  .text-h1     { font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: var(--ls-h1); }
  .text-h2     { font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: var(--ls-h2); }
  .text-h3     { font-size: var(--fs-h3); line-height: var(--lh-h3); letter-spacing: var(--ls-h3); }
  .text-h4     { font-size: var(--fs-h4); line-height: var(--lh-h4); letter-spacing: var(--ls-h4); }
  .text-body   { font-size: var(--fs-body); line-height: var(--lh-body); }
  .text-small  { font-size: var(--fs-small); line-height: var(--lh-small); }
  .text-label  { font-size: var(--fs-label); line-height: var(--lh-label); letter-spacing: var(--ls-label); }
  .text-meta   { font-size: var(--fs-meta); line-height: var(--lh-meta); letter-spacing: var(--ls-meta); }

  .text-bg        { color: var(--bg); }
  .text-ink       { color: var(--ink); }
  .text-ink-2     { color: var(--ink-2); }
  .text-ink-3     { color: var(--ink-3); }
  .text-accent    { color: var(--accent); }
  .text-accent-2  { color: var(--accent-2); }

  .bg-bg          { background-color: var(--bg); }
  .bg-surface     { background-color: var(--surface); }
  .bg-paper       { background-color: var(--paper); }
  .bg-accent      { background-color: var(--accent); }
  .bg-accent-2    { background-color: var(--accent-2); }
  .bg-line        { background-color: var(--line); }

  .border-line       { border-color: var(--line); }
  .border-line-strong{ border-color: var(--line-strong); }
  .border-accent     { border-color: var(--accent); }
  .border-accent-2   { border-color: var(--accent-2); }

  .preview-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: var(--accent); color: var(--bg);
    font-family: var(--font-mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.15em;
    padding: 6px 12px; text-align: center;
  }
  main { padding-top: 28px; } /* offset for banner */
</style>
</head>
<body>
  <div class="preview-banner">
    Preview · {{section_name}} · draft · not production fidelity
  </div>

  <main>
    <!-- ============================================================
         SECTION CONTENT GOES BELOW.
         Copy the relevant JSX layout from the anchored component
         (see schema.md → component) and replace text nodes with the
         draft slot values. Keep utility classes; no need for exact
         framer-motion or interactive behaviour.
         ============================================================ -->

    <section class="border-t border-line py-24 px-6 md:px-10">
      <div class="max-w-[1280px] mx-auto">
        <p class="font-mono text-meta uppercase text-ink-3">{{section_label}}</p>
        <h2 class="font-serif text-h2 leading-[1] text-ink mt-4">
          {{headline_lead}}
          <em class="italic text-accent-2">{{headline_emphasis}}</em>
        </h2>
        <p class="font-sans text-body text-ink-2 mt-6 max-w-[620px]">
          {{body_paragraph}}
        </p>
      </div>
    </section>
  </main>
</body>
</html>
