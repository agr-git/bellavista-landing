# Bellavista Coffee — standalone stack (Option A: shared edge nginx).
#
# CRITICAL: this file is SEPARATE from the existing n8n docker-compose at
# /opt/automation/docker-compose.yml. Never merge the two. Lives at
# /srv/bellavista/docker-compose.yml on the Lightsail VPS.
#
# Architecture (Option A — decided during deploy):
# - The existing `nginx` container at /opt/automation/ already owns :80/:443
#   and reverse-proxies to n8n. Bellavista slots in behind that same edge.
# - We attach our app to the EXTERNAL network `automation_automation`
#   (created by the n8n stack). Edge nginx reaches us at `bellavista-app:3000`.
# - No nginx service here; no host port bindings; our container is never
#   directly exposed to the public internet.
#
# Phase A.2 wiring (edge nginx config) lives OUTSIDE this repo at
# /opt/automation/nginx/conf.d/bellavista.conf. See docs/deploy.md.

services:
  app:
    container_name: bellavista-app
    image: bellavista-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Internal only — the edge nginx (on the same network) reaches us by
    # container DNS name `bellavista-app:3000`. No host port mapping.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Forms backend (B9). Blank values = dev-mode fallback logging;
      # production MUST have these set in .env or the service refuses.
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      NOTION_TOKEN: ${NOTION_TOKEN}
      NOTION_RESOURCES_DB_ID: ${NOTION_RESOURCES_DB_ID}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # NextAuth env — wired in B10, safe to set early.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      # Google OAuth + server-only Supabase access (AUTH_MEMBERS_v1).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUBSTACK_FEED_URL: ${SUBSTACK_FEED_URL:-}
      NEXT_PUBLIC_SUBSTACK_URL: ${NEXT_PUBLIC_SUBSTACK_URL:-}
    networks:
      - automation_automation
    # Tight memory cap so a runaway request can't starve n8n.
    mem_limit: 512m
    mem_reservation: 256m

networks:
  # Pre-existing network owned by the n8n stack (/opt/automation/).
  # `external: true` tells compose "do not create — join this existing net".
  # Name format: <compose-project>_<network-key> = automation_automation.
  automation_automation:
    external: true
